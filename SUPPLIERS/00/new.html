<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
    * {
        box-sizing: border-box;
    }
    html, body {
        margin: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
    }
    body {
        padding: 0;
        background: #f2f2f2;
        font-family: Arial, sans-serif;
        color: #111;
    }
    .window {
        width: 100%;
        height: 100dvh;
        margin: 0;
        background: white;
        border: 1px solid #999;
        display: flex;
        flex-direction: column;
    }
    .title {
        flex: 0 0 auto;
        background: #d9eaf7;
        border-bottom: 1px solid #999;
        padding: 10px;
        font-size: 20px;
        font-weight: bold;
    }
    .info {
        flex: 0 0 auto;
        display: flex;
        gap: 20px;
        padding: 8px 10px;
        background: #eee;
        border-bottom: 1px solid #aaa;
        font-size: 16px;
    }
    .table-scroll {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
    }
    thead {
        position: sticky;
        top: 0;
        z-index: 10;
    }
    th {
        background: #d9d9d9;
        border: 1px solid #999;
        padding: 8px 5px;
        font-size: 17px;
    }
    td {
        border: 1px solid #aaa;
        padding: 4px;
        height: 48px;
        font-size: 17px;
        text-align: right;
    }
    th:first-child {
        width: 100%;
        text-align: center;
    }
td:first-child {
        padding-left: 8px;
        text-align: left;
    }
input {
        width: 100%;
        height: 40px;
        min-width: 0;
        border: 1px solid #777;
        border-radius: 2px;
        font-size: 20px;
        text-align: center;
        background: white;
    }
    select {
        width: 75px;
        height: 40px;
        flex: 0 0 35px;
        border: 1px solid #777;
        border-radius: 2px;
        font-size: 16px;
        text-align: center;
        background: white;
    }
    input:focus, select:focus {
        outline: 2px solid #4a90e2;
        background: #fffde6;
    }
    input:disabled, select:disabled {
        background: #e5e5e5;
        color: #777;
        cursor: not-allowed;
    }
    .bottom {
        flex: 0 0 auto;
        padding: 12px;
        border-top: 1px solid #999;
        background: #eee;
    }
    button {
        width: 100%;
        min-height: 55px;
        border: 1px solid #555;
        border-radius: 3px;
        font-size: 19px;
        font-weight: bold;
        cursor: pointer;
    }
    .send {
        background: #25D366;
        color: white;
        border-color: #128C7E;
    }
    .hint {
        margin-top: 8px;
        font-size: 16px;
        color: green;
        text-align: center;
    }
    #branch{
        text-transform: uppercase;
    }

    .add-product-wrap {
        padding: 10px 12px 0;
        background: #eee;
    }

    .add-product-btn {
        width: 100%;
        min-height: 46px;
        border: 1px solid #777;
        border-radius: 3px;
        background: #fff;
        color: #111;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .add-product-btn:active {
        background: #e5e5e5;
    } 
    .product-controls {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 3px;
    }

    .edit-product-btn {
        width: auto;
        min-height: 25px;
        padding: 2px 7px;
        border: 1px solid #888;
        border-radius: 3px;
        background: #f5f5f5;
        color: #333;
        font-size: 12px;
        font-weight: normal;
        cursor: pointer;
    }

    .edit-product-btn:active {
        background: #ddd;
    }

    .product-use-label {
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 12px;
        white-space: nowrap;
        cursor: pointer;
        color: #555;
    }

    .product-use-label input {
        width: 15px;
        height: 15px;
        margin: 0;
        cursor: pointer;
    }

    .product-not-used {
        opacity: 0.55;
    }

    .product-not-used td:first-child {
        text-decoration: line-through;
    }

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.45);
        align-items: center;
        justify-content: center;
        padding: 16px;
    }

    .modal.show {
        display: flex;
    }

    .modal-content {
        width: min(420px, 100%);
        background: white;
        border: 1px solid #777;
        border-radius: 6px;
        padding: 18px;
        box-shadow: 0 5px 25px rgba(0,0,0,.25);
    }

    .modal-content h3 {
        margin: 0 0 15px;
        font-size: 20px;
    }

    .modal-label {
        display: block;
        margin: 10px 0 5px;
        font-size: 16px;
        font-weight: bold;
    }

    .modal-content input,
    .modal-content select {
        width: 100%;
        height: 42px;
        font-size: 17px;
        text-align: left;
        padding: 0 8px;
    }

    .modal-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
    }

    .modal-actions button {
        min-height: 44px;
        font-size: 16px;
    }

    .modal-cancel {
        background: #eee;
        color: #111;
    }

    .modal-save {
        background: #25D366;
        color: white;
        border-color: #128C7E;
    }

    @media (max-width: 600px) {
        body {
            padding: 0;
        }
        .title {
            font-size: 18px;
            padding: 8px;
        }
        .info {
            font-size: 15px;
            padding: 7px 8px;
        }
        th {
            font-size: 15px;
            padding: 6px 4px;
        }
        td {
            font-size: 16px;
            height: 48px;
        }
        input {
            height: 42px;
            font-size: 19px;
        }
        select {
            height: 42px;
            flex: 0 0 35px;
            width: 65px;
            font-size: 15px;
        }
        th:first-child {
            width: 100%;
        }
.bottom {
            padding: 8px;
        }
        button {
            min-height: 48px;
            font-size: 17px;
        }
        .hint {
            font-size: 16px;
            margin-top: 5px;
        }
    }
</style>
</head>
<body>
    <div class="window">
        <div class="title"></div>
        <div class="info">
            <div><b>Филиал: <br></b><span id="branch"></span></div>
            <div><b>Поставщик: <br></b><span id="supplier"></span></div>
            <div><b>Дата: <br></b><span id="date"></span></div>
        </div>
        <div class="table-scroll">
            <table id="productsTable">
                <thead><tr><th>Наименование</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="add-product-wrap">
            <button type="button" class="add-product-btn" onclick="openAddProductModal()">＋ ДОБАВИТЬ ТОВАР</button>
        </div>
        <div class="bottom">
            <button class="send" onclick="sendWhatsApp()">ОТПРАВИТЬ ОПЕРАТОРУ ЗАКАЗОВ</button>
            <div class="hint">Снимите «используется», если товар не используется в этом филиале.</div>
        </div>
    </div>

    <!-- Окно добавления товара -->
    <div id="addProductModal" class="modal" onclick="closeAddProductModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="productModalTitle">Добавить товар</h3>
            <input id="editingProductIndex" type="hidden" value="-1">

            <label class="modal-label" for="newProductName">Название товара</label>
            <input id="newProductName" type="text" placeholder="Например: Сахар">

            <label class="modal-label" for="newProductUnit">Единица измерения</label>
            <select id="newProductUnit"></select>

            <div class="modal-actions">
                <button type="button" class="modal-cancel" onclick="closeAddProductModal()">ОТМЕНА</button>
                <button type="button" class="modal-save" onclick="addProduct()">ДОБАВИТЬ</button>
            </div>
        </div>
    </div>
    <script>

        const phone = "77083400580";
        const branch = "Пришахтинск";
        const supplier = "КОНДИТЕРСНАБ";
        // Добавить дни заявок и дни поставок, чтобы видели периодичность поставок
        // const dd = "Среда " + " — " + "Четверг";
        const units = [ "м", "в", "б", "кг", "уп", "шт", "ящ", "кор" ];
        const products = [
            // { name: "TEMP",                 unit: "TEMP"  },
 
            { name: "Тюльпаны (для Канелла)",	            unit: "уп"  },
            { name: "РК-25 (высокая)",	                    unit: "уп"  },
            { name: "Лоток 20L (под рыбу)",	                unit: "уп"  },
            { name: "Лоток 21L",	                        unit: "уп"  },
            { name: "Лоток 25",	                            unit: "уп"  },
            { name: "Лоток 26",	                            unit: "уп"  },
            { name: "Лоток 28",	                            unit: "уп"  },
            { name: "SL 11/2  /  РК 6",	                    unit: "уп"  },
            { name: "SL 235 P",                             unit: "уп"  },
            { name: "SL 228 низкую",	                    unit: "уп"  },
            { name: "SL 85 (М)",	                        unit: "уп"  },
            { name: "Капсула бум. d90 h25 бел. (пончик)",	unit: "уп"  },
            { name: "Капсула бум. d45 h27,5 бел. (мафф)",	unit: "уп"  },
            { name: "Капсула бум. d30 h15 бел. (наборы)",	unit: "уп"  },
            { name: "Салфетки круглые / квадрат",	        unit: "уп"  },
            { name: "Бумага пергаментная",	                unit: "кг"  },
            { name: "Пищевая пленка 38/1200",	            unit: "шт"  },
            
            { name: "Сухое молоко",	                        unit: "кг"  },
            { name: "Кунжут",	                            unit: "м"   },
            { name: "Подварка",	                            unit: "б"   },
            { name: "Шоколад монетка",	                    unit: "ящ"  },
            { name: "Сливки 33% (БМК)",	                    unit: "ящ"  },
        ];
        const days = [ "Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота" ];
        const now = new Date();
        const day = days[now.getDay()];
        document.title = `${day} — ${branch}`;
        document.querySelector(".title").textContent = `Заказ товаров — ${day}`;
        document.querySelector("#branch").textContent = branch;
        document.querySelector("#supplier").textContent = supplier;
        /* ======= СОЗДАНИЕ ТАБЛИЦЫ ======= */
        function renderProducts() {
            const tbody = document.querySelector("#productsTable tbody");

            tbody.innerHTML = products.map((product, index) => {
                const isUsed = product.used !== false;

                return `
                    <tr
                        data-product="${product.name}"
                        class="${isUsed ? "" : "product-not-used"}"
                    >
                        <td>
                            <div>${product.name}</div>

                            <div class="product-controls">
                                <button
                                    type="button"
                                    class="edit-product-btn"
                                    onclick="openEditProductModal(${index})"
                                >✎ Изм.</button>

                                <label class="product-use-label">
                                    <input
                                        type="checkbox"
                                        ${isUsed ? "checked" : ""}
                                        onchange="toggleProductUsed(${index}, this.checked)"
                                    >
                                    используется
                                </label>
                            </div>
                        </td>
                    </tr>
                `;
            }).join("");
        }

        renderProducts();

        /* ======= ДОБАВЛЕНИЕ И РЕДАКТИРОВАНИЕ ТОВАРА ======= */
        function fillNewProductUnits(selectedUnit = "") {
            const select = document.getElementById("newProductUnit");
            select.innerHTML = units.map(unit => `<option value="${unit}" ${unit === selectedUnit ? "selected" : ""}>${unit}</option>`).join("");
        }

        function openAddProductModal() {
            fillNewProductUnits(units[0]);
            document.getElementById("newProductName").value = "";
            document.getElementById("editingProductIndex").value = "-1";
            document.getElementById("productModalTitle").textContent = "Добавить товар";
            document.getElementById("addProductModal").classList.add("show");
            setTimeout(() => document.getElementById("newProductName").focus(), 50);
        }

        function openEditProductModal(index) {
            const product = products[index];
            if (!product) return;
            fillNewProductUnits(product.unit);
            document.getElementById("newProductName").value = product.name;
            document.getElementById("editingProductIndex").value = String(index);
            document.getElementById("productModalTitle").textContent = "Редактировать товар";
            document.getElementById("addProductModal").classList.add("show");
            setTimeout(() => { const input=document.getElementById("newProductName"); input.focus(); input.select(); }, 50);
        }

        function closeAddProductModal(event) {
            if (event && event.target !== document.getElementById("addProductModal")) return;
            document.getElementById("addProductModal").classList.remove("show");
        }

        function toggleProductUsed(index, used) {
            if (!products[index]) return;

            products[index].used = used;
            renderProducts();
        }

        function addProduct() {
            const nameInput=document.getElementById("newProductName");
            const unitInput=document.getElementById("newProductUnit");
            const index=Number(document.getElementById("editingProductIndex").value);
            const name=nameInput.value.trim(), unit=unitInput.value;
            if (!name) { alert("Введите название товара."); nameInput.focus(); return; }
            const exists=products.some((product,i)=>i!==index && product.name.toLowerCase()===name.toLowerCase());
            if (exists) { alert("Такой товар уже есть в списке."); nameInput.focus(); return; }
            if (index >= 0 && products[index]) { products[index].name=name; products[index].unit=unit; }
            else { products.push({name, unit}); }
            renderProducts();
            document.getElementById("addProductModal").classList.remove("show");
            if (index < 0) {
                const rows=document.querySelectorAll("#productsTable tbody tr"), lastRow=rows[rows.length-1];
                if (lastRow) { lastRow.scrollIntoView({behavior:"smooth",block:"center"}); setTimeout(()=>{ const input=lastRow.querySelector(".order-input"); if(input) input.focus(); },300); }
            }
        }

        // Закрытие окна по Esc
        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") {
                document.getElementById("addProductModal").classList.remove("show");
            }
        });

        /* ======= ДАТА ======= */
        function getDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, "0");
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const year = now.getFullYear();
            return `${day}/${month}/${year}`;
        }
        document.getElementById("date").textContent = getDate();
        /* ======= ПРЕОБРАЗОВАНИЕ ЗНАЧЕНИЯ ======= */
        function getValue(input) {
            let value = input.value.trim();
            /* Пустое значение = 0 */
            if (value === "") { return 0; }
            /* Дефис = - */
            if (value === "-") { return "-"; }
            /* Запятая превращается в точку для Number() */
            value = value.replace(",", ".");
            const number = Number(value);
            if (Number.isNaN(number)) { return 0; }
            return number;
        }
        /* ======= СОЗДАНИЕ ТЕКСТА WHATSAPP ======= */
        function createTSV() {
            const date = getDate();
            let lines = [];

            lines.push(date + " — " + branch + " — " + supplier + "\n");

            products.forEach(product => {
                if (product.used === false) {
                    lines.push(product.name + " — не используется");
                } else {
                    lines.push(product.name);
                }
            });

            return lines.join("\n");
        }

        /* ======= WHATSAPP ======= */
        function sendWhatsApp() {
            const text = createTSV();
            const url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(text);
            window.open(url, "_blank");
        }
    </script>
</body>
</html>
